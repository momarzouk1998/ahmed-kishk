name: Build & Deploy — Ahmed Kishk

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: momarzouk1998/ahmed-kishk

jobs:
  build-and-push:
    name: 🐳 Build Docker Image & Push to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔑 Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: ⚙️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 📦 Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: 🚀 Deploy to DigitalOcean Droplet
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: 📡 Deploy via SSH to DigitalOcean Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "🔑 Logging into GHCR on server..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin || echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            echo "📥 Pulling latest Docker image from GHCR..."
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

            echo "🛑 Stopping existing container if running..."
            docker stop ahmed-kishk || true
            docker rm ahmed-kishk || true

            echo "🚀 Starting new container on port 3009..."
            docker run -d \
              --name ahmed-kishk \
              --restart unless-stopped \
              --network host \
              -e PORT=3009 \
              -e DATABASE_URL="${{ secrets.DATABASE_URL }}" \
              -e AUTH_SECRET="${{ secrets.AUTH_SECRET }}" \
              -e NODE_ENV="production" \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

            echo "⏳ Waiting for app to be ready..."
            sleep 5

            echo "🗄️ Running database migrations..."
            docker exec ahmed-kishk npx prisma db push --skip-generate || true

            echo "🌱 Seeding database (upsert — safe to run multiple times)..."
            docker exec ahmed-kishk npx tsx prisma/seed.ts || true

            echo "🧹 Cleaning up unused docker images..."
            docker image prune -f

            echo "✅ Deployment completed successfully!"
