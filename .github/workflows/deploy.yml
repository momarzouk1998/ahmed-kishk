name: Deploy to Server

on:
  workflow_run:
    workflows: ["Build & Push to GHCR"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: momarzouk1998/ahmed-kishk

jobs:
  deploy:
    name: 🚀 Deploy via SSH
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: 📡 Deploy via SSH to DigitalOcean Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "🔑 Logging into GHCR on server..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin || echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            echo "📥 Pulling latest Docker image from GHCR..."
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

            echo "🛑 Stopping existing container if running..."
            docker stop ahmed-kishk || true
            docker rm ahmed-kishk || true

            echo "🚀 Starting new container on port 3009..."
            docker run -d \
              --name ahmed-kishk \
              --restart unless-stopped \
              --network host \
              -e PORT=3009 \
              -e DATABASE_URL="${{ secrets.DATABASE_URL }}" \
              -e AUTH_SECRET="${{ secrets.AUTH_SECRET }}" \
              -e NODE_ENV="production" \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

            echo "⏳ Waiting 10s for container startup..."
            sleep 10

            echo "🗄️ Pushing Prisma schema to database..."
            docker exec ahmed-kishk sh -c "node node_modules/prisma/build/index.js db push --skip-generate --accept-data-loss" || echo "db push warning"

            echo "🌱 Seeding database..."
            docker exec ahmed-kishk sh -c "node node_modules/tsx/dist/cli.mjs prisma/seed.ts" || docker exec ahmed-kishk npx tsx prisma/seed.ts || echo "seed warning"

            echo "🧹 Cleaning up unused docker images..."
            docker image prune -f

            echo "✅ Deployment completed successfully!"
